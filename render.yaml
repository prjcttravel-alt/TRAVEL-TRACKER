    name: travel-tracker
    env: node
    region: singapore
    plan: free
    buildCommand: npm install --prefix ./server --legacy-peer-deps && npm install --prefix ./client --legacy-peer-deps --include=dev && npm install --prefix ./admin-dashboard --legacy-peer-deps --include=dev && npm run build:client && npm run build:admin
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        value: mongodb+srv://prjcttravel_db_user:Pokemon47@cluster0.zrrkpq9.mongodb.net/?appName=Cluster0
      - key: JWT_SECRET
        sync: false          # Enter this in Render dashboard
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://travel-agency-7xjp.onrender.com
