services:
  - type: web
    name: travel-tracker
    env: node
    region: singapore
    plan: free
    buildCommand: npm install --prefix ./server --legacy-peer-deps && npm install --prefix ./client --legacy-peer-deps && npm install --prefix ./admin-dashboard --legacy-peer-deps && npm run build:client && npm run build:admin
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false          # Enter this in Render dashboard
      - key: JWT_SECRET
        sync: false          # Enter this in Render dashboard
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false          # Your Render app URL e.g. https://travel-tracker.onrender.com
