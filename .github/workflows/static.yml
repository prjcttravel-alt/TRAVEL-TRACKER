# Workflow for building and deploying the React Client to GitHub Pages
name: Deploy React Client to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'
          
      - name: Install Dependencies
        working-directory: ./client
        run: npm ci || npm install --legacy-peer-deps
        
      - name: Generate Static API
        working-directory: ./server
        run: npm install mongoose && node build-data.js
        
      - name: Build Client
        working-directory: ./client
        run: npm run build
        env:
          CI: false
          VITE_API_URL: https://travel-agency-7xjp.onrender.com/api
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './client/dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
